<svg xmlns="http://www.w3.org/2000/svg" width="880" height="160" viewBox="0 0 880 160" role="img" aria-labelledby="title desc">
  <title id="title">Animated contribution snake</title>
  <desc id="desc">A cyan snake continuously travels across a stylized contribution grid.</desc>

  <defs>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect class="empty-cell" width="10" height="10" x="2" y="2" rx="2" fill="#e2e8f0"/>
    </pattern>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="route" pathLength="1" d="M51 27H779V41H51V55H779V69H51V83H779V97H51V111H779V125H51"/>
  </defs>

  <style>
    @media (prefers-color-scheme: dark) {
      #background { fill: #0d1117; stroke: #30363d; }
      .empty-cell { fill: #21262d; }
      .label { fill: #8b949e; }
    }
  </style>

  <rect id="background" x="1" y="1" width="878" height="158" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g id="grid">
    <rect x="42" y="20" width="742" height="112" fill="url(#grid)"/>

    <g fill="#bae6fd">
      <rect x="58" y="36" width="10" height="10" rx="2"/><rect x="100" y="78" width="10" height="10" rx="2"/>
      <rect x="156" y="22" width="10" height="10" rx="2"/><rect x="212" y="92" width="10" height="10" rx="2"/>
      <rect x="268" y="50" width="10" height="10" rx="2"/><rect x="338" y="106" width="10" height="10" rx="2"/>
      <rect x="422" y="36" width="10" height="10" rx="2"/><rect x="492" y="78" width="10" height="10" rx="2"/>
      <rect x="562" y="22" width="10" height="10" rx="2"/><rect x="646" y="92" width="10" height="10" rx="2"/>
      <rect x="730" y="64" width="10" height="10" rx="2"/>
    </g>
    <g fill="#38bdf8">
      <rect x="86" y="64" width="10" height="10" rx="2"/><rect x="184" y="106" width="10" height="10" rx="2"/>
      <rect x="296" y="36" width="10" height="10" rx="2"/><rect x="380" y="78" width="10" height="10" rx="2"/>
      <rect x="464" y="106" width="10" height="10" rx="2"/><rect x="604" y="50" width="10" height="10" rx="2"/>
      <rect x="702" y="22" width="10" height="10" rx="2"/>
    </g>
    <g fill="#0284c7">
      <rect x="128" y="50" width="10" height="10" rx="2"/><rect x="240" y="78" width="10" height="10" rx="2"/>
      <rect x="352" y="22" width="10" height="10" rx="2"/><rect x="534" y="92" width="10" height="10" rx="2"/>
      <rect x="674" y="36" width="10" height="10" rx="2"/><rect x="758" y="106" width="10" height="10" rx="2"/>
    </g>
  </g>

  <g fill="url(#snake)" filter="url(#glow)">
    <circle r="7">
      <animateMotion dur="14s" repeatCount="indefinite" begin="-0.00s"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="6.4" opacity=".92">
      <animateMotion dur="14s" repeatCount="indefinite" begin="-0.07s"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="5.8" opacity=".82">
      <animateMotion dur="14s" repeatCount="indefinite" begin="-0.14s"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="5.2" opacity=".7">
      <animateMotion dur="14s" repeatCount="indefinite" begin="-0.21s"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="4.6" opacity=".56">
      <animateMotion dur="14s" repeatCount="indefinite" begin="-0.28s"><mpath href="#route"/></animateMotion>
    </circle>
  </g>

  <text class="label" x="440" y="149" text-anchor="middle" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.6">KEEP BUILDING · KEEP LEARNING</text>
</svg>
