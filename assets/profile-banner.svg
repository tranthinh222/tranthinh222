<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Tran Quoc Thinh — Software Developer</title>
  <desc id="desc">A dark blue developer profile banner with abstract code and network motifs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#94a3b8" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1015" cy="105" r="280" fill="url(#glow)"/>
  <circle cx="130" cy="300" r="220" fill="url(#glow)" opacity=".55"/>

  <g opacity=".6" stroke="url(#accent)" stroke-width="2">
    <path d="M865 77l83 47 80-48 87 52" fill="none"/>
    <path d="M948 124v91l82 45 84-47v-85" fill="none"/>
    <path d="M1030 76v184" fill="none" stroke-dasharray="5 8" opacity=".55"/>
  </g>
  <g fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#shadow)">
    <circle cx="865" cy="77" r="10"/>
    <circle cx="948" cy="124" r="10"/>
    <circle cx="1030" cy="76" r="10"/>
    <circle cx="1115" cy="128" r="10"/>
    <circle cx="948" cy="215" r="10"/>
    <circle cx="1030" cy="260" r="10"/>
    <circle cx="1114" cy="213" r="10"/>
  </g>

  <g transform="translate(82 73)">
    <rect width="86" height="86" rx="22" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <path d="M34 28L18 43l16 15M52 28l16 15-16 15" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="198" y="117" fill="#f8fafc" font-size="45" font-weight="700" letter-spacing=".5">TRAN QUOC THINH</text>
    <rect x="200" y="140" width="438" height="4" rx="2" fill="url(#accent)"/>
    <text x="200" y="184" fill="#7dd3fc" font-size="22" font-weight="600" letter-spacing="4">SOFTWARE DEVELOPER</text>
    <text x="200" y="226" fill="#cbd5e1" font-size="18">Building useful products · Learning through real projects</text>
  </g>

  <g transform="translate(200 251)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">
    <rect width="386" height="36" rx="18" fill="#020617" fill-opacity=".68" stroke="#334155"/>
    <circle cx="20" cy="18" r="4" fill="#2dd4bf"/>
    <text x="34" y="23" fill="#94a3b8">github.com/</text>
    <text x="126" y="23" fill="#e0f2fe" font-weight="700">tranthinh222</text>
  </g>
</svg>
